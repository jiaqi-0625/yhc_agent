name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18.4-alpine3.24
        env:
          POSTGRES_DB: firefly_test
          POSTGRES_USER: firefly
          POSTGRES_PASSWORD: firefly_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U firefly -d firefly_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run test:postgres
        env:
          TEST_DATABASE_URL: postgresql://firefly:firefly_test_password@127.0.0.1:5432/firefly_test
          POSTGRES_TEST_ALLOW_SCHEMA_RESET: "true"
      - run: npm run audit:prod
